<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark-mode");
        }
      })();
    </script>
    <link rel="stylesheet" href="src/sass/main.scss" />
    <title>Dashbord</title>
  </head>
  <body>
    <div class="container--dashboard">
      <!-- toast container -->
      <div class="toastBox"></div>
      <div class="dashboard-sidebar">
        <nav class="nav">
          <div class="nav__logo">
            <img src="src/img/Logo-symbol.png" alt="banca logo" />
            <img src="src/img/Logo-name.png" alt="banca logo" />
          </div>
          <a href="#" class="nav__link" data-view="dashboard-view">
            <svg class="nav__icon">
              <use xlink:href="src/img/sprite.svg#icon-th-small-outline"></use>
            </svg>
            <span>Dashboard</span></a
          >
          <a href="#" class="nav__link" data-view="transaction-view">
            <svg class="nav__icon">
              <use xlink:href="src/img/sprite.svg#icon-swap_horiz"></use>
            </svg>
            <span>Transactions</span></a
          >

          <a href="#" class="nav__link" data-view="funding-view">
            <svg class="nav__icon">
              <use xlink:href="src/img/sprite.svg#icon-credit-card"></use>
            </svg>
            <span>Fund Account</span></a
          >

          <a href="#" class="nav__link" data-view="loan-view">
            <svg class="nav__icon">
              <use xlink:href="src/img/sprite.svg#icon-money"></use>
            </svg>
            <span>Apply For Loan</span></a
          >
          <!-- Mobile view -->
          <a class="nav__link mobile-nav">
            <div class="notification-container mobile-nav">
              <div class="notification mobile-nav">
                <span class="notification__count">1</span>
              </div>
              <ion-icon
                class="nav__icon"
                name="notifications-outline"
              ></ion-icon>
            </div>
          </a>
          <a href="/login.html" class="nav__link mobile-nav">
            <ion-icon class="nav__icon" name="log-out"></ion-icon>
          </a>
        </nav>
      </div>
      <div class="dashboard-main">
        <!-- Main View Content -->
      </div>
    </div>
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <script defer type="module" src="src/js/dashboard/controller.js"></script>
  </body>
</html>
